<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voltando ao PlayLivre</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"></head><body><main>
<header><img src="logo.png" alt="Logo do PlayLivre"><a href="index.html">PlayLivre</a></header>
<h1>Voltando ao PlayLivre…</h1>
<p id="msg">Se o app não abrir sozinho, toque no botão abaixo.</p>
<p><a id="open" class="btn" href="#">Abrir o PlayLivre</a></p>
<p class="muted">Esta página só repassa a resposta do login do Spotify para o app no seu celular. Nada é guardado aqui.</p>
<script>
  // Repassa ?code=…&state=… (ou ?error=…) do Spotify para o app (playlivre://spotify).
  var q = location.search || "";
  var intent = "intent://spotify" + q + "#Intent;scheme=playlivre;package=com.albert.playlivre;end";
  var direct = "playlivre://spotify" + q;
  var isAndroid = /Android/i.test(navigator.userAgent);
  document.getElementById("open").href = isAndroid ? intent : direct;
  if (/error=/.test(q)) document.getElementById("msg").textContent = "O login no Spotify foi cancelado ou recusado. Volte ao app e tente de novo.";
  if (isAndroid) location.replace(intent);
</script>
<footer><a href="index.html">Início</a><a href="privacidade.html">Privacidade</a></footer></main></body></html>
